name: Build dev test image

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dev-image
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish dev test image
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set dev image metadata
        shell: bash
        run: |
          RAGFLOW_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          BUILD_BASE_REVISION="$(tr -d '[:space:]' < docker/BUILD_BASE_REVISION)"
          GIT_COMMIT="${GITHUB_SHA::7}"
          if [[ -z "${RAGFLOW_VERSION}" ]]; then
            echo "Unable to read the RAGFlow version from pyproject.toml" >&2
            exit 1
          fi
          if [[ ! "${BUILD_BASE_REVISION}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid build base revision: ${BUILD_BASE_REVISION}" >&2
            exit 1
          fi
          {
            echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "BUILD_BASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ragflow-build-base"
            echo "BUILD_BASE_TAG=${RAGFLOW_VERSION}.${BUILD_BASE_REVISION}"
            echo "GIT_COMMIT=${GIT_COMMIT}"
            echo "DEV_IMAGE_TAG=${RAGFLOW_VERSION}.${GIT_COMMIT}.dev"
          } >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.DEV_IMAGE_TAG }}

      - name: Check build base image
        id: check-build-base
        shell: bash
        run: |
          if docker buildx imagetools inspect \
            "${BUILD_BASE_IMAGE}:${BUILD_BASE_TAG}" >/dev/null 2>&1; then
            echo "Build base already exists: ${BUILD_BASE_IMAGE}:${BUILD_BASE_TAG}"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Build base does not exist: ${BUILD_BASE_IMAGE}:${BUILD_BASE_TAG}"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build and publish build base
        if: steps.check-build-base.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ env.BUILD_BASE_IMAGE }}:${{ env.BUILD_BASE_TAG }}
          cache-from: type=gha,scope=build-base
          cache-to: type=gha,mode=max,scope=build-base

      - name: Build and publish dev test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.final
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_BASE_IMAGE=${{ env.BUILD_BASE_IMAGE }}:${{ env.BUILD_BASE_TAG }}
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          cache-from: type=gha,scope=dev-final
          cache-to: type=gha,mode=max,scope=dev-final
