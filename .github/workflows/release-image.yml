name: Build release image

on:
  push:
    branches:
      - release

permissions:
  contents: read
  packages: write

concurrency:
  group: release-image
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set release metadata
        shell: bash
        run: |
          RAGFLOW_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -n 1)"
          GIT_COMMIT="${GITHUB_SHA::9}"
          if [[ -z "${RAGFLOW_VERSION}" ]]; then
            echo "Unable to read the RAGFlow version from pyproject.toml" >&2
            exit 1
          fi
          {
            echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "GIT_COMMIT=${GIT_COMMIT}"
            echo "RELEASE_VERSION=${RAGFLOW_VERSION}.${GIT_COMMIT}"
          } >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_VERSION }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
