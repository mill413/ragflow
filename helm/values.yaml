# 基于 Docker Compose 的 .env 文件

# 全局镜像、存储与调度配置
global:
  # 全局镜像仓库前缀，用于通过镜像站或私有仓库拉取所有镜像。
  # 示例："registry.example.com/myproj"
  # 配置后，模板会替换每个镜像地址的仓库部分并保留镜像路径。
  # 留空则使用各组件自身配置的镜像仓库。
  repo: ""
  # 所有使用 HostPath 的组件存储卷的可选根目录。
  # 配置后，Chart 会拼接各组件的 storage.hostPath；如果组件路径为空，
  # 则拼接该组件的默认目录名。
  # 示例：配置为 "/data/ragflow" 时会生成 "/data/ragflow/es"、
  # "/data/ragflow/mysql"、"/data/ragflow/minio" 和 "/data/ragflow/redis"。
  # 留空则保持各组件原有的 storage.hostPath 行为。
  hostPath: ""
  # 所有 Pod 共用的镜像拉取 Secret。
  imagePullSecrets: []
  # 将 Chart 中的所有 Pod 调度到匹配以下标签的节点。
  # 示例：
  # nodeSelector:
  #   kubernetes.io/arch: amd64
  nodeSelector: {}
  # 将 Chart 中的所有 Pod 调度到 `kubectl get nodes` 显示的指定节点。
  # 配置后，此项的优先级高于 nodeSelector。
  nodeName: ""

env:
  # RAGFlow 运行时配置。以下默认值应与 docker/docker-compose.yml 保持一致。
  API_PROXY_SCHEME: python
  ALLOW_ANY_HOST: "0"
  REGISTER_ENABLED: "1"
  USE_DOCLING: "false"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  THREAD_POOL_MAX_WORKERS: "128"
  DISABLE_PASSWORD_LOGIN: "false"

  # 浏览器标题和面向用户显示的产品名称。建议在部署时设置，
  # 不要在此处提交特定部署环境使用的值。
  # APP_NAME: ""
  # 产品图标和浏览器 favicon 地址，支持 HTTP(S) 绝对 URL。
  # APP_ICON_URL: "https://example.com/logo.svg"

  # 初始超级管理员。仅在首次部署时取消以下配置的注释，
  # 并同时在 ragflow.api.args 中启用 --init-superuser。
  # DEFAULT_SUPERUSER_NICKNAME: "admin"
  # DEFAULT_SUPERUSER_EMAIL: "admin@ragflow.io"
  # DEFAULT_SUPERUSER_PASSWORD: "admin"

  # 此 Chart 使用的文档引擎。
  DOC_ENGINE: elasticsearch

  # Elasticsearch 版本。
  STACK_VERSION: "8.11.3"

  # Elasticsearch 用户名和密码。
  ES_USER: elastic
  # Elasticsearch 密码。
  ELASTIC_PASSWORD: infini_rag_flow_helm

  # MySQL 连接配置。
  MYSQL_USER: root
  MYSQL_PASSWORD: infini_rag_flow_helm
  MYSQL_DBNAME: rag_flow
  MYSQL_MAX_PACKET: "1073741824"
  # 外部 MySQL 主机地址（仅在 mysql.enabled=false 时需要）。
  # MYSQL_HOST: ""
  # 外部 MySQL 端口（未设置时默认为 3306）。
  # MYSQL_PORT: "3306"

  # MinIO 用户名。
  MINIO_USER: rag_flow
  # MinIO 密码。
  MINIO_PASSWORD: infini_rag_flow_helm
  # 外部 MinIO 主机地址。
  # MINIO_HOST: ""
  # 外部 MinIO 端口（未设置时默认为 9000）。
  # MINIO_PORT: "9000"

  # Redis 密码。
  REDIS_PASSWORD: infini_rag_flow_helm
  # 外部 Redis 主机地址（仅在 redis.enabled=false 时需要）。
  # REDIS_HOST: ""
  # 外部 Redis 端口（未设置时默认为 6379）。
  # REDIS_PORT: "6379"

  # 本地时区。
  TZ: "Asia/Shanghai"

  # 如果访问 huggingface.co 受限，可取消下一行的注释：
  # HF_ENDPOINT: https://hf-mirror.com

  # 单次上传请求允许的最大总大小，单位为字节（2 GiB）。
  MAX_CONTENT_LENGTH: "2147483648"
  # 修改后，请同步更新 nginx/nginx.conf 中的 `client_max_body_size`。

  # 文档解析时单批处理的文档分块数量。
  DOC_BULK_SIZE: 4

  # 嵌入向量化时单批处理的文本分块数量。
  EMBEDDING_BATCH_SIZE: 16

  # 共享测试服务器采用较为保守的解析并发配置。
  # 两个任务执行器各允许一个并发任务，因此最多同时运行两个解析任务；
  # 其余任务继续在队列中等待。
  MAX_CONCURRENT_TASKS: "1"
  MAX_CONCURRENT_CHUNK_BUILDERS: "1"
  MAX_CONCURRENT_MINIO: "8"

  # Elasticsearch 容器的内存上限在下方设置为 10 GiB。JVM 堆保持为 4 GiB，
  # 以便将其余内存留给 Lucene 和操作系统缓存。
  ES_JAVA_OPTS: "-Xms4g -Xmx4g"

ragflow:
  image:
    repository: infiniflow/ragflow
    tag: v0.26.4
    pullPolicy: IfNotPresent
    pullSecrets: []
  # 其他支持的启动参数：
  # - --disable-webserver
  # - --disable-taskexecutor
  # - --disable-datasync
  # - --enable-mcpserver
  # - --init-superuser
  # - --consumer-no-beg=0
  # - --consumer-no-end=4
  # - --host-id=ragflow-node-1
  # - --mcp-host=0.0.0.0
  # - --mcp-port=9382
  # - --mcp-base-url=http://127.0.0.1:9380
  # - --mcp-mode=self-host
  # - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # - --mcp-script-path=/ragflow/mcp/server/server.py
  # - --no-transport-sse-enabled
  # - --no-transport-streamable-http-enabled
  # - --no-json-response
  # 可选的服务配置覆盖项，将写入 RAGFlow 容器内的
  # local.service_conf.yaml 文件。
  # https://ragflow.io/docs/dev/configurations#service-configuration
  service_conf:

  # 可选的 OA 登录渠道。除非在 service_conf 中启用
  # authentication.disable_password_login，否则密码登录仍然可用。
  oa:
    enabled: false
    displayName: "OA"
    icon: sso
    clientId: ""
    authorizationUrl: ""
    tokenUrl: ""
    userinfoUrl: ""
    # 必须与 OA 服务中注册的回调地址完全一致。
    redirectUri: ""
    scope: api
    requestTimeout: 30
    # 生产环境建议使用已有的 Secret。existingSecret 为空时，
    # clientSecret 将存储在由此 Chart 管理的环境变量 Secret 中。
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: client-secret

  # 可选的 YAML 格式覆盖配置，用于修改 RAGFlow
  # 容器内的 llm_factories.json 文件。
  llm_factories:
    # factory_llm_infos:
    # - name: OpenAI-API-Compatible
    #   logo: ""
    #   tags: "LLM,TEXT EMBEDDING,SPEECH2TEXT,MODERATION"
    #   status: "1"
    #   llm:
    #     - llm_name: my-custom-llm
    #       tags: "LLM,CHAT,"
    #       max_tokens: 100000
    #       model_type: chat
    #       is_tools: false

  service:
    type: NodePort
    # 仅在 type 为 NodePort 时使用，留空则由集群自动分配。
    nodePort:
  admin:
    # 是否启用管理后台服务。
    enabled: true
    # 管理后台服务端口配置。
    port: 9381
  api:
    replicas: 1
    # API Deployment 提供 Web 界面、API、管理后台和数据同步服务。
    # 此 Deployment 不执行解析任务，解析由独立的 Worker Deployment 处理。
    args:
      - --enable-adminserver
      - --init-model-provider-tables
      - --disable-taskexecutor
    deployment:
      strategy:
      # 测试服务器资源上限：4 核 CPU / 4 GiB 内存。
      resources:
        requests:
          cpu: "2"
          memory: "3Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
    service:
      enabled: true
  worker:
    replicas: 1
    # Worker Deployment 负责消费解析任务，无需对外提供 Service。
    args:
      - --disable-webserver
      - --disable-datasync
      - --workers=2
    deployment:
      strategy:
      # 测试服务器资源上限：12 核 CPU / 10 GiB 内存。
      resources:
        requests:
          cpu: "6"
          memory: "7Gi"
        limits:
          cpu: "12"
          memory: "10Gi"

elasticsearch:
  image:
    repository: elasticsearch
    tag: "8.11.3"
    pullPolicy: IfNotPresent
    pullSecrets: []
  initContainers:
    alpine:
      repository: alpine
      tag: "3.24.1"
      pullPolicy: IfNotPresent
    busybox:
      repository: busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
  storage:
    className:
    capacity: 20Gi
    # 静态 HostPath PV 使用的可选节点绝对路径。配置 global.hostPath 后，
    # 此项改为可选的路径后缀。两者都留空时使用集群动态存储供应。
    hostPath: ""
  deployment:
    strategy:
    # 测试服务器资源上限：8 核 CPU / 10 GiB 内存。
    resources:
      requests:
        cpu: "4"
        memory: "8Gi"
      limits:
        cpu: "8"
        memory: "10Gi"
  service:
    type: NodePort
    # 仅在 type 为 NodePort 时使用。
    nodePort:

minio:
  enabled: true
  image:
    repository: pgsty/minio
    tag: RELEASE.2026-03-25T00-00-00Z
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # 静态 HostPath PV 使用的可选节点绝对路径。配置 global.hostPath 后，
    # 此项改为可选的路径后缀。两者都留空时使用集群动态存储供应。
    hostPath: ""
  deployment:
    strategy:
    # 测试服务器资源上限：3 核 CPU / 3 GiB 内存。
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "3"
        memory: "3Gi"
  service:
    type: NodePort
    # 仅在 type 为 NodePort 时使用。
    nodePorts:
      s3:
      console:

mysql:
  enabled: true
  image:
    repository: mysql
    tag: 8.0.39
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # 静态 HostPath PV 使用的可选节点绝对路径。配置 global.hostPath 后，
    # 此项改为可选的路径后缀。两者都留空时使用集群动态存储供应。
    hostPath: ""
  deployment:
    strategy:
    # 测试服务器资源上限：3 核 CPU / 3 GiB 内存。
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "3"
        memory: "3Gi"
  service:
    type: NodePort
    # 仅在 type 为 NodePort 时使用。
    nodePort:

redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # 静态 HostPath PV 使用的可选节点绝对路径。配置 global.hostPath 后，
    # 此项改为可选的路径后缀。两者都留空时使用集群动态存储供应。
    hostPath: ""
  persistence:
    enabled: true
    # 设置持久化存储的保留策略（仅适用于 Kubernetes 1.32 及更高版本）。
    # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    # retentionPolicy:
      # whenDeleted: Delete
      # whenScaled: Delete
  deployment:
    strategy:
    # 测试服务器资源上限：2 核 CPU / 2 GiB 内存。
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
# 此配置块用于设置 Web 服务的 Ingress。更多信息请参阅：
# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
