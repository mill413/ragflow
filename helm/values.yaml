# Based on docker compose .env file

# Global image pull secrets configuration
global:
  # Global image repo prefix to render all images from a mirror/registry.
  # Example: "registry.example.com/myproj"
  # When set, template will replace the registry part of each image and keep the path.
  # Leave empty to use per-image repositories as-is.
  repo: ""
  # Global image pull secrets for all pods
  imagePullSecrets: []
  # Schedule all chart pods onto nodes matching these labels.
  # Example:
  # nodeSelector:
  #   kubernetes.io/arch: amd64
  nodeSelector: {}
  # Schedule all chart pods onto the exact node name shown by
  # `kubectl get nodes`. When set, this takes precedence over nodeSelector.
  nodeName: ""

env:
  # RAGFlow runtime settings. Keep these defaults aligned with docker/docker-compose.yml.
  API_PROXY_SCHEME: python
  ALLOW_ANY_HOST: "0"
  REGISTER_ENABLED: "1"
  USE_DOCLING: "false"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  THREAD_POOL_MAX_WORKERS: "128"
  DISABLE_PASSWORD_LOGIN: "false"

  # Browser title and user-facing product name. Prefer setting this during
  # deployment instead of committing a deployment-specific value here.
  # APP_NAME: ""
  # Product icon and browser favicon URL. Supports absolute HTTP(S) URLs.
  # APP_ICON_URL: "https://example.com/logo.svg"

  # Initial superuser. Uncomment these values together with
  # ragflow.api.args --init-superuser for the first deployment only.
  # DEFAULT_SUPERUSER_NICKNAME: "admin"
  # DEFAULT_SUPERUSER_EMAIL: "admin@ragflow.io"
  # DEFAULT_SUPERUSER_PASSWORD: "admin"

  # The document engine used by this chart.
  DOC_ENGINE: elasticsearch

  # The version of Elasticsearch.
  STACK_VERSION: "8.11.3"

  # The username and password for Elasticsearch.
  ES_USER: elastic
  # The password for Elasticsearch
  ELASTIC_PASSWORD: infini_rag_flow_helm

  # MySQL connection settings.
  MYSQL_USER: root
  MYSQL_PASSWORD: infini_rag_flow_helm
  MYSQL_DBNAME: rag_flow
  MYSQL_MAX_PACKET: "1073741824"
  # External MySQL host (only required when mysql.enabled=false)
  # MYSQL_HOST: ""
  # External MySQL port (defaults to 3306 if not set)
  # MYSQL_PORT: "3306"

  # The username for MinIO.
  MINIO_USER: rag_flow
  # The password for MinIO
  MINIO_PASSWORD: infini_rag_flow_helm
  # External MinIO host
  # MINIO_HOST: ""
  # External MinIO port (defaults to 9000 if not set)
  # MINIO_PORT: "9000"

  # The password for Redis
  REDIS_PASSWORD: infini_rag_flow_helm
  # External Redis host (only required when redis.enabled=false)
  # REDIS_HOST: ""
  # External Redis port (defaults to 6379 if not set)
  # REDIS_PORT: "6379"

  # The local time zone.
  TZ: "Asia/Shanghai"

  # Uncomment the following line if you have limited access to huggingface.co:
  # HF_ENDPOINT: https://hf-mirror.com

  # The maximum total size of one upload request, in bytes (2 GiB).
  MAX_CONTENT_LENGTH: "2147483648"
  # After making the change, ensure you update `client_max_body_size` in nginx/nginx.conf correspondingly.

  # The number of document chunks processed in a single batch during document parsing.
  DOC_BULK_SIZE: 4

  # The number of text chunks processed in a single batch during embedding vectorization.
  EMBEDDING_BATCH_SIZE: 16

  # Keep parsing concurrency conservative for the shared test server.
  # Two task executors with one concurrent task each allow at most two
  # parsing tasks to run at the same time; additional tasks remain queued.
  MAX_CONCURRENT_TASKS: "1"
  MAX_CONCURRENT_CHUNK_BUILDERS: "1"
  MAX_CONCURRENT_MINIO: "8"

  # Elasticsearch runs with a 10 GiB container limit below. Keep the JVM heap
  # at 4 GiB so the remaining memory is available to Lucene and the OS cache.
  ES_JAVA_OPTS: "-Xms4g -Xmx4g"

ragflow:
  image:
    repository: infiniflow/ragflow
    tag: v0.26.4
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Other supported arguments:
  # - --disable-webserver
  # - --disable-taskexecutor
  # - --disable-datasync
  # - --enable-mcpserver
  # - --init-superuser
  # - --consumer-no-beg=0
  # - --consumer-no-end=4
  # - --host-id=ragflow-node-1
  # - --mcp-host=0.0.0.0
  # - --mcp-port=9382
  # - --mcp-base-url=http://127.0.0.1:9380
  # - --mcp-mode=self-host
  # - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # - --mcp-script-path=/ragflow/mcp/server/server.py
  # - --no-transport-sse-enabled
  # - --no-transport-streamable-http-enabled
  # - --no-json-response
  # Optional service configuration overrides
  # to be written to local.service_conf.yaml
  # inside the RAGFlow container
  # https://ragflow.io/docs/dev/configurations#service-configuration
  service_conf:

  # Optional OA login channel. Password login remains available unless
  # authentication.disable_password_login is enabled in service_conf.
  oa:
    enabled: false
    displayName: "OA"
    icon: sso
    clientId: ""
    authorizationUrl: ""
    tokenUrl: ""
    userinfoUrl: ""
    # Must exactly match the callback registered with the OA service.
    redirectUri: ""
    scope: api
    requestTimeout: 30
    # Prefer an existing Secret in production. When existingSecret is empty,
    # clientSecret is stored in the chart-managed env Secret.
    clientSecret: ""
    existingSecret: ""
    existingSecretKey: client-secret

  # Optional yaml formatted override for the
  # llm_factories.json file inside the RAGFlow
  # container.
  llm_factories:
    # factory_llm_infos:
    # - name: OpenAI-API-Compatible
    #   logo: ""
    #   tags: "LLM,TEXT EMBEDDING,SPEECH2TEXT,MODERATION"
    #   status: "1"
    #   llm:
    #     - llm_name: my-custom-llm
    #       tags: "LLM,CHAT,"
    #       max_tokens: 100000
    #       model_type: chat
    #       is_tools: false

  service:
    type: NodePort
    # Used only when type is NodePort. Leave empty for automatic allocation.
    nodePort:
  admin:
    # Enable Admin Service
    enabled: true
    # Admin Service port configuration
    port: 9381
  api:
    replicas: 1
    # The API deployment serves the web UI, API, admin server, and data sync.
    # Parsing is disabled and handled by the dedicated worker deployment.
    args:
      - --enable-adminserver
      - --init-model-provider-tables
      - --disable-taskexecutor
    deployment:
      strategy:
      # Test-server limit: 4 CPU / 4 GiB.
      resources:
        requests:
          cpu: "2"
          memory: "3Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
    service:
      enabled: true
  worker:
    replicas: 1
    # The worker deployment consumes parsing tasks without exposing a service.
    args:
      - --disable-webserver
      - --disable-datasync
      - --workers=2
    deployment:
      strategy:
      # Test-server limit: 12 CPU / 10 GiB.
      resources:
        requests:
          cpu: "6"
          memory: "7Gi"
        limits:
          cpu: "12"
          memory: "10Gi"

elasticsearch:
  image:
    repository: elasticsearch
    tag: "8.11.3"
    pullPolicy: IfNotPresent
    pullSecrets: []
  initContainers:
    alpine:
      repository: alpine
      tag: "3.24.1"
      pullPolicy: IfNotPresent
    busybox:
      repository: busybox
      tag: "1.38.0"
      pullPolicy: IfNotPresent
  storage:
    className:
    capacity: 20Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    # Test-server limit: 8 CPU / 10 GiB.
    resources:
      requests:
        cpu: "4"
        memory: "8Gi"
      limits:
        cpu: "8"
        memory: "10Gi"
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePort:

minio:
  enabled: true
  image:
    repository: pgsty/minio
    tag: RELEASE.2026-03-25T00-00-00Z
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    # Test-server limit: 3 CPU / 3 GiB.
    resources:
      requests:
        cpu: "1"
        memory: "1Gi"
      limits:
        cpu: "3"
        memory: "3Gi"
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePorts:
      s3:
      console:

mysql:
  enabled: true
  image:
    repository: mysql
    tag: 8.0.39
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    # Test-server limit: 3 CPU / 3 GiB.
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "3"
        memory: "3Gi"
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePort:

redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  persistence:
    enabled: true
    # Set's the retention policy for the persistent storage (only available in k8s 1.32 or later)
    # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    # retentionPolicy:
      # whenDeleted: Delete
      # whenScaled: Delete
  deployment:
    strategy:
    # Test-server limit: 2 CPU / 2 GiB.
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2"
        memory: "2Gi"
# This block is for setting up web service ingress. For more information, see:
# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
