# Based on docker compose .env file

# Global image pull secrets configuration
global:
  # Global image repo prefix to render all images from a mirror/registry.
  # Example: "registry.example.com/myproj"
  # When set, template will replace the registry part of each image and keep the path.
  # Leave empty to use per-image repositories as-is.
  repo: ""
  # Global image pull secrets for all pods
  imagePullSecrets: []
  # Schedule all chart pods onto nodes matching these labels.
  # Example:
  # nodeSelector:
  #   kubernetes.io/arch: amd64
  nodeSelector: {}
  # Schedule all chart pods onto the exact node name shown by
  # `kubectl get nodes`. When set, this takes precedence over nodeSelector.
  nodeName: ""

env:
  # RAGFlow runtime settings. Keep these defaults aligned with docker/docker-compose.yml.
  API_PROXY_SCHEME: python
  ALLOW_ANY_HOST: "0"
  REGISTER_ENABLED: "1"
  USE_DOCLING: "false"
  DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
  THREAD_POOL_MAX_WORKERS: "128"
  DISABLE_PASSWORD_LOGIN: "false"

  # Browser title and user-facing product name. Prefer setting this during
  # deployment instead of committing a deployment-specific value here.
  # APP_NAME: ""

  # The document engine used by this chart.
  DOC_ENGINE: elasticsearch

  # The version of Elasticsearch.
  STACK_VERSION: "8.11.3"

  # The username and password for Elasticsearch.
  ES_USER: elastic
  # The password for Elasticsearch
  ELASTIC_PASSWORD: infini_rag_flow_helm

  # MySQL connection settings.
  MYSQL_USER: root
  MYSQL_PASSWORD: infini_rag_flow_helm
  MYSQL_DBNAME: rag_flow
  MYSQL_MAX_PACKET: "1073741824"
  # External MySQL host (only required when mysql.enabled=false)
  # MYSQL_HOST: ""
  # External MySQL port (defaults to 3306 if not set)
  # MYSQL_PORT: "3306"

  # The username for MinIO.
  MINIO_USER: rag_flow
  # The password for MinIO
  MINIO_PASSWORD: infini_rag_flow_helm
  # External MinIO host
  # MINIO_HOST: ""
  # External MinIO port (defaults to 9000 if not set)
  # MINIO_PORT: "9000"

  # The password for Redis
  REDIS_PASSWORD: infini_rag_flow_helm
  # External Redis host (only required when redis.enabled=false)
  # REDIS_HOST: ""
  # External Redis port (defaults to 6379 if not set)
  # REDIS_PORT: "6379"

  # The local time zone.
  TZ: "Asia/Shanghai"

  # Uncomment the following line if you have limited access to huggingface.co:
  # HF_ENDPOINT: https://hf-mirror.com

  # The maximum total size of one upload request, in bytes (2 GiB).
  MAX_CONTENT_LENGTH: "2147483648"
  # After making the change, ensure you update `client_max_body_size` in nginx/nginx.conf correspondingly.

  # The number of document chunks processed in a single batch during document parsing.
  DOC_BULK_SIZE: 4

  # The number of text chunks processed in a single batch during embedding vectorization.
  EMBEDDING_BATCH_SIZE: 16

ragflow:
  image:
    repository: infiniflow/ragflow
    tag: v0.26.4
    pullPolicy: IfNotPresent
    pullSecrets: []
  # Arguments passed to docker/entrypoint.sh. These defaults match
  # docker/docker-compose.yml.
  args:
    - --enable-adminserver
    - --init-model-provider-tables
    - --workers=1
  # Other supported arguments:
  # - --disable-webserver
  # - --disable-taskexecutor
  # - --disable-datasync
  # - --enable-mcpserver
  # - --init-superuser
  # - --consumer-no-beg=0
  # - --consumer-no-end=4
  # - --host-id=ragflow-node-1
  # - --mcp-host=0.0.0.0
  # - --mcp-port=9382
  # - --mcp-base-url=http://127.0.0.1:9380
  # - --mcp-mode=self-host
  # - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  # - --mcp-script-path=/ragflow/mcp/server/server.py
  # - --no-transport-sse-enabled
  # - --no-transport-streamable-http-enabled
  # - --no-json-response
  # Optional service configuration overrides
  # to be written to local.service_conf.yaml
  # inside the RAGFlow container
  # https://ragflow.io/docs/dev/configurations#service-configuration
  service_conf:

  # Optional yaml formatted override for the
  # llm_factories.json file inside the RAGFlow
  # container.
  llm_factories:
    # factory_llm_infos:
    # - name: OpenAI-API-Compatible
    #   logo: ""
    #   tags: "LLM,TEXT EMBEDDING,SPEECH2TEXT,MODERATION"
    #   status: "1"
    #   llm:
    #     - llm_name: my-custom-llm
    #       tags: "LLM,CHAT,"
    #       max_tokens: 100000
    #       model_type: chat
    #       is_tools: false

  # Kubernetes configuration
  deployment:
    strategy:
    resources:
  service:
    type: NodePort
    # Used only when type is NodePort. Leave empty for automatic allocation.
    nodePort:
  admin:
    # Enable Admin Service
    enabled: true
    # Admin Service port configuration
    port: 9381
  api:
    service:
      enabled: true

elasticsearch:
  image:
    repository: elasticsearch
    tag: "8.11.3"
    pullPolicy: IfNotPresent
    pullSecrets: []
  initContainers:
    alpine:
      repository: alpine
      tag: latest
      pullPolicy: IfNotPresent
    busybox:
      repository: busybox
      tag: latest
      pullPolicy: IfNotPresent
  storage:
    className:
    capacity: 20Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePort:

minio:
  enabled: true
  image:
    repository: pgsty/minio
    tag: RELEASE.2026-03-25T00-00-00Z
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    resources:
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePorts:
      s3:
      console:

mysql:
  enabled: true
  image:
    repository: mysql
    tag: 8.0.39
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  deployment:
    strategy:
    resources:
  service:
    type: NodePort
    # Used only when type is NodePort.
    nodePort:

redis:
  enabled: true
  image:
    repository: valkey/valkey
    tag: 8
    pullPolicy: IfNotPresent
    pullSecrets: []
  storage:
    className:
    capacity: 5Gi
    # Optional absolute node path for a static HostPath PV.
    # Leave empty to use dynamic provisioning from the cluster.
    hostPath: ""
  persistence:
    enabled: true
    # Set's the retention policy for the persistent storage (only available in k8s 1.32 or later)
    # https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    # retentionPolicy:
      # whenDeleted: Delete
      # whenScaled: Delete
  deployment:
    strategy:
    resources:
# This block is for setting up web service ingress. For more information, see:
# https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
