name: ragflow-test

services:
  ragflow:
    image: ${RAGFLOW_IMAGE:-ragflow-local:dev}
    command:
      # Component switches. Web, task executor, and data sync are enabled by
      # default; uncomment the corresponding disable flag when separating them.
      # - --disable-webserver
      # - --disable-taskexecutor
      # - --disable-datasync
      - --enable-adminserver
      # - --enable-mcpserver

      # One-time initialization.
      - --init-model-provider-tables
      # - --init-superuser

      # Task executor selection. Use workers, or uncomment both consumer range
      # values. host-id defaults to the container hostname.
      - --workers=1
      # - --consumer-no-beg=0
      # - --consumer-no-end=4
      # - --host-id=ragflow-node-1

      # MCP server settings; effective only with --enable-mcpserver.
      # - --mcp-host=0.0.0.0
      # - --mcp-port=9382
      # - --mcp-base-url=http://127.0.0.1:9380
      # - --mcp-mode=self-host
      # - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      # - --mcp-script-path=/ragflow/mcp/server/server.py

      # MCP transports and response mode are enabled by default. Uncomment to
      # disable the corresponding behavior.
      # - --no-transport-sse-enabled
      # - --no-transport-streamable-http-enabled
      # - --no-json-response
    env_file: .env
    environment:
      APP_NAME: ${APP_NAME:-RAGFlow}
      APP_ICON_URL: ${APP_ICON_URL:-/logo.svg}
      DOC_ENGINE: elasticsearch
      ES_HOST: es01
      MYSQL_HOST: mysql
      MINIO_HOST: minio
      REDIS_HOST: redis
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - ${SVR_WEB_HTTP_PORT:-80}:80
      - ${SVR_WEB_HTTPS_PORT:-443}:443
      - ${SVR_HTTP_PORT:-9380}:9380
      - ${ADMIN_SVR_HTTP_PORT:-9381}:9381
      - ${SVR_MCP_PORT:-9382}:9382
    volumes:
      - ragflow_logs:/ragflow/logs
    depends_on:
      es01:
        condition: service_healthy
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9381/api/v1/admin/ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    networks:
      - ragflow

  mysql:
    image: mysql:8.0.39
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-infini_rag_flow}
    command:
      - --max_connections=256
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --init-file=/data/application/init.sql
      - --binlog_expire_logs_seconds=604800
      - --innodb_buffer_pool_size=256M
      - --max_allowed_packet=1073741824
    ports:
      - ${EXPOSE_MYSQL_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/data/application/init.sql:ro
    mem_limit: ${RAGFLOW_TEST_MYSQL_MEMORY:-1g}
    cpus: ${RAGFLOW_TEST_MYSQL_CPUS:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragflow

  es01:
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    env_file: .env
    environment:
      node.name: es01
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      ES_JAVA_OPTS: ${RAGFLOW_ES_JAVA_OPTS:--Xms1g -Xmx1g}
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    ports:
      - ${ES_PORT:-1200}:9200
    volumes:
      - es_data:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${RAGFLOW_TEST_ES_MEMORY:-3g}
    cpus: ${RAGFLOW_TEST_ES_CPUS:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragflow

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-infini_rag_flow}
    ports:
      - ${MINIO_PORT:-9000}:9000
      - ${MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio_data:/data
    mem_limit: ${RAGFLOW_TEST_MINIO_MEMORY:-512m}
    cpus: ${RAGFLOW_TEST_MINIO_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 20s
    restart: unless-stopped
    networks:
      - ragflow

  redis:
    image: valkey/valkey:8
    env_file: .env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-infini_rag_flow}
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - ${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    mem_limit: ${RAGFLOW_TEST_REDIS_MEMORY:-256m}
    cpus: ${RAGFLOW_TEST_REDIS_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-infini_rag_flow}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    networks:
      - ragflow

  kibana-setup:
    profiles: ["kibana"]
    image: elasticsearch:${STACK_VERSION:-8.11.3}
    env_file: .env
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:-infini_rag_flow}
      KIBANA_PASSWORD: ${KIBANA_PASSWORD:-infini_rag_flow}
    command:
      - bash
      - -c
      - >-
        curl -fsS -u "elastic:$${ELASTIC_PASSWORD}"
        -X POST http://es01:9200/_security/user/kibana_system/_password
        -H 'Content-Type: application/json'
        -d "{\"password\":\"$${KIBANA_PASSWORD}\"}"
    depends_on:
      es01:
        condition: service_healthy
    mem_limit: ${RAGFLOW_TEST_KIBANA_SETUP_MEMORY:-256m}
    cpus: ${RAGFLOW_TEST_KIBANA_SETUP_CPUS:-0.25}
    restart: "no"
    networks:
      - ragflow

  kibana:
    profiles: ["kibana"]
    image: kibana:${STACK_VERSION:-8.11.3}
    env_file: .env
    environment:
      ELASTICSEARCH_HOSTS: http://es01:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-infini_rag_flow}
    ports:
      - ${KIBANA_PORT:-6601}:5601
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    mem_limit: ${RAGFLOW_TEST_KIBANA_MEMORY:-1g}
    cpus: ${RAGFLOW_TEST_KIBANA_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5601/api/status"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragflow

  sandbox-executor-manager:
    profiles: ["sandbox"]
    image: ${SANDBOX_EXECUTOR_MANAGER_IMAGE:-infiniflow/sandbox-executor-manager:latest}
    privileged: true
    env_file: .env
    environment:
      SANDBOX_EXECUTOR_MANAGER_POOL_SIZE: ${SANDBOX_EXECUTOR_MANAGER_POOL_SIZE:-3}
      SANDBOX_BASE_PYTHON_IMAGE: ${SANDBOX_BASE_PYTHON_IMAGE:-infiniflow/sandbox-base-python:latest}
      SANDBOX_BASE_NODEJS_IMAGE: ${SANDBOX_BASE_NODEJS_IMAGE:-infiniflow/sandbox-base-nodejs:latest}
      SANDBOX_ENABLE_SECCOMP: ${SANDBOX_ENABLE_SECCOMP:-false}
      SANDBOX_MAX_MEMORY: ${SANDBOX_MAX_MEMORY:-256m}
      SANDBOX_TIMEOUT: ${SANDBOX_TIMEOUT:-10s}
    ports:
      - ${SANDBOX_EXECUTOR_MANAGER_PORT:-9385}:9385
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - no-new-privileges:true
    mem_limit: ${RAGFLOW_TEST_SANDBOX_MANAGER_MEMORY:-512m}
    cpus: ${RAGFLOW_TEST_SANDBOX_MANAGER_CPUS:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9385/healthz"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 20s
    restart: unless-stopped
    networks:
      - ragflow

volumes:
  ragflow_logs:
  mysql_data:
  es_data:
  minio_data:
  redis_data:
  kibana_data:

networks:
  ragflow:
    driver: bridge
