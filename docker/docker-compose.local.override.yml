services:
  ragflow-cpu:
    image: ${RAGFLOW_LOCAL_IMAGE:-ragflow-local:dev}
    ports: !override
      - "18082:80"
      - "18443:443"
      - "19380:9380"
      - "19381:9381"
      - "19382:9382"
      - "19384:9384"
      - "19383:9383"
    command:
      - --disable-taskexecutor
      - --disable-datasync
      - --enable-adminserver
      - --init-model-provider-tables
    mem_limit: 3072m
    cpus: "1.50"
    environment:
      DOC_BULK_SIZE: "1"
      EMBEDDING_BATCH_SIZE: "1"

  mysql:
    mem_limit: 640m
    cpus: "0.75"
    command:
      --max_connections=128
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
      --innodb_buffer_pool_size=256M

  infinity:
    mem_limit: 768m
    cpus: "0.75"

  minio:
    mem_limit: 256m
    cpus: "0.50"

  redis:
    mem_limit: 128m
    cpus: "0.25"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru
