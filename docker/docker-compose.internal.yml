# 精简的内部部署配置。
#
# 启动前请通过同名环境变量替换默认密码，例如：
#   export RAGFLOW_INTERNAL_MYSQL_PASSWORD='...'
#   export RAGFLOW_INTERNAL_MINIO_PASSWORD='...'
#   export RAGFLOW_INTERNAL_REDIS_PASSWORD='...'
#   export RAGFLOW_INTERNAL_ELASTIC_PASSWORD='...'
#
# 离线导入镜像：
#   docker load -i ragflow-dev-0.26.4.0f0f3b700-docker-images-amd64.tar.gz
# 启动：
#   docker compose -f docker-compose.internal.yml up -d

name: ragflow-internal

services:
  ragflow:
    image: ragflow-local:dev
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --workers=1
    environment:
      TZ: Asia/Shanghai
      DOC_ENGINE: elasticsearch
      API_PROXY_SCHEME: python
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DBNAME: rag_flow
      MYSQL_USER: root
      MYSQL_PASSWORD: ${RAGFLOW_INTERNAL_MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_MAX_PACKET: "1073741824"
      MINIO_HOST: minio
      MINIO_USER: ${RAGFLOW_INTERNAL_MINIO_USER:-rag_flow}
      MINIO_PASSWORD: ${RAGFLOW_INTERNAL_MINIO_PASSWORD:-infini_rag_flow}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${RAGFLOW_INTERNAL_REDIS_PASSWORD:-infini_rag_flow}
      ES_HOST: es01
      ES_USER: elastic
      ELASTIC_PASSWORD: ${RAGFLOW_INTERNAL_ELASTIC_PASSWORD:-infini_rag_flow}
    ports:
      - ${RAGFLOW_INTERNAL_HTTP_PORT:-18082}:80
      - ${RAGFLOW_INTERNAL_HTTPS_PORT:-18443}:443
    volumes:
      - ragflow_logs:/ragflow/logs
    depends_on:
      mysql:
        condition: service_healthy
      es01:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${RAGFLOW_INTERNAL_APP_MEMORY:-6g}
    cpus: ${RAGFLOW_INTERNAL_APP_CPUS:-4.0}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9381/api/v1/admin/ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped
    networks:
      - ragflow

  mysql:
    image: mysql:8.0.39
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${RAGFLOW_INTERNAL_MYSQL_PASSWORD:-infini_rag_flow}
      MYSQL_DATABASE: rag_flow
    command:
      - --max_connections=256
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --tls_version=TLSv1.2,TLSv1.3
      - --binlog_expire_logs_seconds=604800
      - --innodb_buffer_pool_size=256M
      - --max_allowed_packet=1073741824
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: ${RAGFLOW_INTERNAL_MYSQL_MEMORY:-1g}
    cpus: ${RAGFLOW_INTERNAL_MYSQL_CPUS:-1.0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragflow

  es01:
    image: elasticsearch:8.11.3
    environment:
      node.name: es01
      discovery.type: single-node
      bootstrap.memory_lock: "false"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${RAGFLOW_INTERNAL_ELASTIC_PASSWORD:-infini_rag_flow}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
      cluster.routing.allocation.disk.watermark.low: 5gb
      cluster.routing.allocation.disk.watermark.high: 3gb
      cluster.routing.allocation.disk.watermark.flood_stage: 2gb
    volumes:
      - es_data:/usr/share/elasticsearch/data
    tmpfs:
      - /tmp:mode=1777,size=512m
    mem_limit: ${RAGFLOW_INTERNAL_ES_MEMORY:-3g}
    cpus: ${RAGFLOW_INTERNAL_ES_CPUS:-2.0}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 30s
    restart: unless-stopped
    networks:
      - ragflow

  minio:
    image: pgsty/minio:RELEASE.2026-03-25T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    environment:
      MINIO_ROOT_USER: ${RAGFLOW_INTERNAL_MINIO_USER:-rag_flow}
      MINIO_ROOT_PASSWORD: ${RAGFLOW_INTERNAL_MINIO_PASSWORD:-infini_rag_flow}
    volumes:
      - minio_data:/data
    mem_limit: ${RAGFLOW_INTERNAL_MINIO_MEMORY:-512m}
    cpus: ${RAGFLOW_INTERNAL_MINIO_CPUS:-0.5}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 20s
    restart: unless-stopped
    networks:
      - ragflow

  redis:
    image: valkey/valkey:8
    command:
      - redis-server
      - --requirepass
      - ${RAGFLOW_INTERNAL_REDIS_PASSWORD:-infini_rag_flow}
      - --appendonly
      - "yes"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    mem_limit: ${RAGFLOW_INTERNAL_REDIS_MEMORY:-256m}
    cpus: ${RAGFLOW_INTERNAL_REDIS_CPUS:-0.5}
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${RAGFLOW_INTERNAL_REDIS_PASSWORD:-infini_rag_flow}",
          "ping",
        ]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 10s
    restart: unless-stopped
    networks:
      - ragflow

volumes:
  ragflow_logs:
  mysql_data:
  es_data:
  minio_data:
  redis_data:

networks:
  ragflow:
    driver: bridge
